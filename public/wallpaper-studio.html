<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진일라벨 프리미엄 바탕화면 스튜디오 (1920x1080 / 4K)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --font-sans: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: "Plus Jakarta Sans", sans-serif;
            --font-mono: "JetBrains Mono", monospace;
        }

        body {
            font-family: var(--font-sans);
            background-color: #030712;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Header & Toolbar */
        .studio-header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 24px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .brand-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #f8fafc;
        }

        .brand-sub {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
        }

        /* Controls */
        .theme-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(2, 6, 23, 0.6);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .theme-btn {
            font-family: var(--font-sans);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .theme-btn.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            font-family: var(--font-sans);
            height: 40px;
            padding: 0 18px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
        }

        .btn-download-fhd {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
        }
        .btn-download-fhd:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.6);
        }

        .btn-download-4k {
            background: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-download-4k:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        /* 🖼️ Canvas Preview Area */
        .preview-container {
            width: 100%;
            max-width: 1200px;
            position: relative;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            background: #020617;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #wallpaperCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Footer tip */
        .tip-text {
            margin-top: 16px;
            color: #64748b;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- 🛠️ Header & Controls -->
    <div class="studio-header">
        <div class="brand-info">
            <div class="brand-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                    <polyline points="2 17 12 22 22 17"/>
                    <polyline points="2 12 12 17 22 12"/>
                </svg>
            </div>
            <div>
                <div class="brand-title">진일라벨 프리미엄 바탕화면</div>
                <div class="brand-sub">1920 × 1080 (FHD) & 4K Ultra HD Wallpaper</div>
            </div>
        </div>

        <div class="theme-selector">
            <button class="theme-btn active" onclick="setTheme('aurora')">🌌 오로라 사이버</button>
            <button class="theme-btn" onclick="setTheme('minimal')">🖤 미니멀 옵시디언</button>
            <button class="theme-btn" onclick="setTheme('brand')">💎 진일 테크 블루</button>
            <button class="theme-btn" onclick="setTheme('sunset')">🌅 선셋 네온</button>
        </div>

        <div class="btn-group">
            <button class="btn btn-download-fhd" onclick="exportWallpaper(1920, 1080, '진일라벨_배경화면_1920x1080.png')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                </svg>
                <span>1920 × 1080 다운로드</span>
            </button>
            <button class="btn btn-download-4k" onclick="exportWallpaper(3840, 2160, '진일라벨_배경화면_4K_3840x2160.png')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
                <span>4K 초고화질 저장</span>
            </button>
        </div>
    </div>

    <!-- 🖼️ 16:9 Canvas Display -->
    <div class="preview-container">
        <canvas id="wallpaperCanvas" width="1920" height="1080"></canvas>
    </div>

    <div class="tip-text">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>다운로드한 이미지를 마우스 우클릭 후 <strong>'바탕 화면 배경으로 설정'</strong>을 누르면 적용됩니다.</span>
    </div>

    <script>
        let currentTheme = 'aurora';
        const canvas = document.getElementById('wallpaperCanvas');
        const ctx = canvas.getContext('2d');

        function drawWallpaper(targetWidth = 1920, targetHeight = 1080, targetCtx = ctx) {
            const w = targetWidth;
            const h = targetHeight;

            // 1. Deep Space Obsidian Background
            const bgGrad = targetCtx.createLinearGradient(0, 0, w, h);
            if (currentTheme === 'aurora') {
                bgGrad.addColorStop(0, '#030712');
                bgGrad.addColorStop(0.5, '#090d16');
                bgGrad.addColorStop(1, '#020617');
            } else if (currentTheme === 'minimal') {
                bgGrad.addColorStop(0, '#09090b');
                bgGrad.addColorStop(0.5, '#030712');
                bgGrad.addColorStop(1, '#020617');
            } else if (currentTheme === 'brand') {
                bgGrad.addColorStop(0, '#020b1e');
                bgGrad.addColorStop(0.5, '#071739');
                bgGrad.addColorStop(1, '#020617');
            } else if (currentTheme === 'sunset') {
                bgGrad.addColorStop(0, '#0c071e');
                bgGrad.addColorStop(0.5, '#190a28');
                bgGrad.addColorStop(1, '#030712');
            }
            targetCtx.fillStyle = bgGrad;
            targetCtx.fillRect(0, 0, w, h);

            // 2. Subtle Tech Grid Pattern
            targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
            targetCtx.lineWidth = 1;
            const gridSize = w / 32;
            for (let x = 0; x < w; x += gridSize) {
                targetCtx.beginPath();
                targetCtx.moveTo(x, 0);
                targetCtx.lineTo(x, h);
                targetCtx.stroke();
            }
            for (let y = 0; y < h; y += gridSize) {
                targetCtx.beginPath();
                targetCtx.moveTo(0, y);
                targetCtx.lineTo(w, y);
                targetCtx.stroke();
            }

            // 3. Volumetric Glowing Light Orbs & Aurora Waves
            targetCtx.save();
            targetCtx.globalCompositeOperation = 'screen';

            if (currentTheme === 'aurora' || currentTheme === 'brand') {
                // Large Royal Blue Nebula
                const glow1 = targetCtx.createRadialGradient(w * 0.75, h * 0.4, 0, w * 0.75, h * 0.4, w * 0.55);
                glow1.addColorStop(0, 'rgba(2, 132, 199, 0.35)');
                glow1.addColorStop(0.5, 'rgba(37, 99, 235, 0.15)');
                glow1.addColorStop(1, 'rgba(0, 0, 0, 0)');
                targetCtx.fillStyle = glow1;
                targetCtx.fillRect(0, 0, w, h);

                // Cyan Electric Aurora
                const glow2 = targetCtx.createRadialGradient(w * 0.25, h * 0.7, 0, w * 0.25, h * 0.7, w * 0.45);
                glow2.addColorStop(0, 'rgba(56, 189, 248, 0.3)');
                glow2.addColorStop(0.5, 'rgba(14, 165, 233, 0.12)');
                glow2.addColorStop(1, 'rgba(0, 0, 0, 0)');
                targetCtx.fillStyle = glow2;
                targetCtx.fillRect(0, 0, w, h);

                // Warm Amber Horizon Accent
                const glow3 = targetCtx.createRadialGradient(w * 0.5, h * 0.9, 0, w * 0.5, h * 0.9, w * 0.4);
                glow3.addColorStop(0, 'rgba(245, 158, 11, 0.18)');
                glow3.addColorStop(0.6, 'rgba(217, 119, 6, 0.05)');
                glow3.addColorStop(1, 'rgba(0, 0, 0, 0)');
                targetCtx.fillStyle = glow3;
                targetCtx.fillRect(0, 0, w, h);
            } else if (currentTheme === 'sunset') {
                const glow1 = targetCtx.createRadialGradient(w * 0.7, h * 0.45, 0, w * 0.7, h * 0.45, w * 0.55);
                glow1.addColorStop(0, 'rgba(244, 63, 94, 0.35)');
                glow1.addColorStop(0.5, 'rgba(217, 70, 239, 0.15)');
                glow1.addColorStop(1, 'rgba(0, 0, 0, 0)');
                targetCtx.fillStyle = glow1;
                targetCtx.fillRect(0, 0, w, h);

                const glow2 = targetCtx.createRadialGradient(w * 0.3, h * 0.65, 0, w * 0.3, h * 0.65, w * 0.45);
                glow2.addColorStop(0, 'rgba(245, 158, 11, 0.3)');
                glow2.addColorStop(0.5, 'rgba(234, 88, 12, 0.12)');
                glow2.addColorStop(1, 'rgba(0, 0, 0, 0)');
                targetCtx.fillStyle = glow2;
                targetCtx.fillRect(0, 0, w, h);
            } else if (currentTheme === 'minimal') {
                const glow1 = targetCtx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, w * 0.6);
                glow1.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
                glow1.addColorStop(0.5, 'rgba(255, 255, 255, 0.02)');
                glow1.addColorStop(1, 'rgba(0, 0, 0, 0)');
                targetCtx.fillStyle = glow1;
                targetCtx.fillRect(0, 0, w, h);
            }

            // 4. Silky Wave Ribbons
            const ribbonGrad = targetCtx.createLinearGradient(0, h * 0.2, w, h * 0.8);
            if (currentTheme === 'sunset') {
                ribbonGrad.addColorStop(0, 'rgba(244, 63, 94, 0.6)');
                ribbonGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.8)');
                ribbonGrad.addColorStop(1, 'rgba(168, 85, 247, 0.4)');
            } else if (currentTheme === 'minimal') {
                ribbonGrad.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
                ribbonGrad.addColorStop(0.5, 'rgba(148, 163, 184, 0.4)');
                ribbonGrad.addColorStop(1, 'rgba(255, 255, 255, 0.15)');
            } else {
                ribbonGrad.addColorStop(0, 'rgba(56, 189, 248, 0.7)');
                ribbonGrad.addColorStop(0.5, 'rgba(37, 99, 235, 0.85)');
                ribbonGrad.addColorStop(1, 'rgba(129, 140, 248, 0.5)');
            }

            targetCtx.strokeStyle = ribbonGrad;
            targetCtx.lineWidth = 3 * (w / 1920);

            for (let i = 0; i < 7; i++) {
                const offset = i * 28 * (w / 1920);
                targetCtx.beginPath();
                targetCtx.moveTo(-w * 0.1, h * 0.75 + offset);
                targetCtx.bezierCurveTo(
                    w * 0.25, h * 0.2 + offset,
                    w * 0.65, h * 0.85 - offset,
                    w * 1.1, h * 0.35 + offset
                );
                targetCtx.stroke();
            }
            targetCtx.restore();

            // 5. Center Luxury Glassmorphism Badge with Jinil Branding
            const cardW = 540 * (w / 1920);
            const cardH = 240 * (h / 1080);
            const cardX = (w - cardW) / 2;
            const cardY = (h - cardH) / 2;
            const radius = 24 * (w / 1920);

            // Card Shadow
            targetCtx.save();
            targetCtx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            targetCtx.shadowBlur = 40 * (w / 1920);
            targetCtx.shadowOffsetY = 16 * (h / 1080);

            // Glass Fill
            targetCtx.fillStyle = 'rgba(15, 23, 42, 0.65)';
            targetCtx.beginPath();
            targetCtx.roundRect(cardX, cardY, cardW, cardH, radius);
            targetCtx.fill();
            targetCtx.restore();

            // Glass Border Highlight
            const borderGrad = targetCtx.createLinearGradient(cardX, cardY, cardX + cardW, cardY + cardH);
            borderGrad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
            borderGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.08)');
            borderGrad.addColorStop(1, 'rgba(56, 189, 248, 0.25)');
            targetCtx.strokeStyle = borderGrad;
            targetCtx.lineWidth = 1.5 * (w / 1920);
            targetCtx.beginPath();
            targetCtx.roundRect(cardX, cardY, cardW, cardH, radius);
            targetCtx.stroke();

            // Inner Typography
            targetCtx.textAlign = 'center';
            targetCtx.textBaseline = 'middle';

            // Brand Title
            targetCtx.font = `900 ${44 * (w / 1920)}px "Pretendard Variable", "Plus Jakarta Sans", sans-serif`;
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillText('진일라벨', w / 2, cardY + cardH * 0.36);

            // Subtitle / English
            targetCtx.font = `800 ${16 * (w / 1920)}px "Plus Jakarta Sans", sans-serif`;
            targetCtx.letterSpacing = '0.24em';
            targetCtx.fillStyle = currentTheme === 'sunset' ? '#f43f5e' : '#38bdf8';
            targetCtx.fillText('JINIL LABEL · DIGITAL WORKSPACE', w / 2, cardY + cardH * 0.62);

            // Status Pill
            targetCtx.font = `600 ${12 * (w / 1920)}px "JetBrains Mono", monospace`;
            targetCtx.fillStyle = '#94a3b8';
            targetCtx.fillText('FOCUSED & PRODUCTIVE · 2026', w / 2, cardY + cardH * 0.82);
        }

        function setTheme(theme) {
            currentTheme = theme;
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            drawWallpaper();
        }

        function exportWallpaper(width, height, filename) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = width;
            offCanvas.height = height;
            const offCtx = offCanvas.getContext('2d');

            drawWallpaper(width, height, offCtx);

            offCanvas.toBlob((blob) => {
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                }
            }, 'image/png', 1.0);
        }

        // Initialize
        window.addEventListener('load', () => {
            drawWallpaper();
        });
        drawWallpaper();
    </script>
</body>
</html>
